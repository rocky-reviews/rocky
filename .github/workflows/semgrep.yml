# Semgrep SAST with p/typescript, p/nodejs, p/secrets, p/owasp-top-ten.
# Runs the pinned semgrep/semgrep container through scripts/security/semgrep.sh
# (the same script developers run locally). Fails on any finding.
name: Semgrep

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Semgrep scan (pinned container)
        run: scripts/security/semgrep.sh
