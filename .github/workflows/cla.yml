# Contributor License Agreement check (CLA Assistant Lite).
# External contributors must sign .github/CLA.md once by commenting
# "I have read the CLA Document and I hereby sign the CLA" on their PR.
# Signatures are committed to the `cla-signatures` branch (create it with
# scripts/github/setup-cla-branch.sh; it must NOT be branch-protected).
#
# Members/owners of the org and bots are exempt. The job is skipped for them,
# which still satisfies a required status check.
#
# pull_request_target runs with base-repo permissions: this workflow must never
# check out or execute code from the PR head. It does not.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: read

jobs:
  cla:
    name: CLA Assistant
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      (
        github.event_name == 'pull_request_target'
        || (
          github.event.issue.pull_request
          && (
            github.event.comment.body == 'recheck'
            || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
          )
        )
      )
      && !contains(fromJSON('["OWNER","MEMBER"]'), github.event.pull_request.author_association || github.event.issue.author_association)
    permissions:
      actions: write # re-run the PR check after a signature comment
      contents: write # commit signatures to the cla-signatures branch
      pull-requests: write # comment on / lock the PR
      statuses: write # set the commit status
    steps:
      - name: CLA Assistant Lite
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed if signatures move to another repository:
          # PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/.github/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot],*[bot]
          lock-pullrequest-aftermerge: true
          custom-notsigned-prcomment: >-
            Thank you for your contribution to Rocky Reviews! Before we can merge it, we need
            you to sign our Contributor License Agreement (CLA). Please read it at the link
            below, then sign by posting the sentence in bold as a comment on this pull request.
            You only need to do this once.
          custom-allsigned-prcomment: "**CLA Assistant Lite** — all contributors have signed the CLA. Thank you!"
