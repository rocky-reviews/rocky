# Evals (P4-7, packages/evals/README.md): the seeded PRs through the real analysis pipeline,
# scored for recall, precision and critical false-positive rate, and gated against a baseline
# (`pnpm evals compare`: fails if total recall drops more than 5 points or the critical
# false-positive rate rises).
#
# - harness: the scripted roles (`--fake`), always, for free: tests the eval harness itself
#   against the committed fake baseline.
# - live: real models, nightly and on PRs that touch prompts, the pipeline or the LLM config.
#   Needs the repository secret ROCKY_EVALS_ANTHROPIC_API_KEY; without it (forks, Dependabot,
#   a repo that has not set it) the job skips with a notice. The key reaches only the step that
#   runs the evals, as the env variable the default LLM config reads (ANTHROPIC_API_KEY).
#   Spend cap: `--max-tokens` from the repository variables ROCKY_EVALS_MAX_TOKENS (PRs) and
#   ROCKY_EVALS_NIGHTLY_MAX_TOKENS (nightly, which adds the injection corpus).
#
# Every third-party action is pinned to a full commit SHA (tag in the comment).
name: evals

on:
  schedule:
    - cron: "23 3 * * *" # nightly 03:23 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/core/src/analysis/**"
      - "packages/core/src/prompt.ts"
      - "packages/core/src/llm.ts"
      - "packages/llm/**"
      - "packages/schema/src/**"
      - "packages/evals/**"
      - "scripts/evals.ts"
      - ".env.example"
      - ".github/workflows/evals.yml"

permissions:
  contents: read

# Never run two paid evals for the same ref at once; a newer push waits instead of cancelling a
# run that has already spent tokens.
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harness:
    name: evals harness (--fake)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json#packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc) with pnpm store cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the evals on the scripted roles
        run: pnpm evals run --fake --injection --out "$RUNNER_TEMP/fake.json"

      - name: Gate against the fake baseline
        run: pnpm evals compare packages/evals/baselines/fake.json "$RUNNER_TEMP/fake.json"

  live:
    name: evals (real models)
    needs: harness
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check for the evals key
        id: key
        env:
          # A boolean, never the value.
          KEY_PRESENT: ${{ secrets.ROCKY_EVALS_ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$KEY_PRESENT" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Real-model evals skipped::The ROCKY_EVALS_ANTHROPIC_API_KEY secret is not available (a fork, Dependabot, or not configured). The scripted harness still ran."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json#packageManager)
        if: steps.key.outputs.present == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc) with pnpm store cache
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run the evals against real models
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ROCKY_EVALS_ANTHROPIC_API_KEY }}
          NIGHTLY: ${{ github.event_name != 'pull_request' }}
          MAX_TOKENS: ${{ github.event_name == 'pull_request' && (vars.ROCKY_EVALS_MAX_TOKENS || '1000000') || (vars.ROCKY_EVALS_NIGHTLY_MAX_TOKENS || '8000000') }}
        run: |
          set -- --max-tokens "$MAX_TOKENS" --out "$RUNNER_TEMP/live.json"
          if [ "$NIGHTLY" = "true" ]; then set -- "$@" --injection; fi
          status=0
          pnpm evals run "$@" > "$RUNNER_TEMP/run.txt" || status=$?
          cat "$RUNNER_TEMP/run.txt"
          {
            echo '### Evals (real models)'
            echo '```'
            cat "$RUNNER_TEMP/run.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Gate against the live baseline
        if: steps.key.outputs.present == 'true'
        run: |
          status=0
          pnpm evals compare packages/evals/baselines/live.json "$RUNNER_TEMP/live.json" > "$RUNNER_TEMP/compare.txt" || status=$?
          cat "$RUNNER_TEMP/compare.txt"
          {
            echo '### Gate'
            echo '```'
            cat "$RUNNER_TEMP/compare.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 3 ]; then
            echo "::warning title=No real-model baseline::packages/evals/baselines/live.json is still the placeholder, so the recall gate is not applied. A human commits the first real baseline (packages/evals/README.md, Real-model baseline)."
            exit 0
          fi
          exit "$status"
