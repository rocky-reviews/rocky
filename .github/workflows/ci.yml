# CI: typecheck + lint + format check + tests with coverage (`pnpm verify`),
# plus actionlint over the workflows themselves. Target: < 5 minutes.
# Every third-party action is pinned to a full commit SHA (tag in the comment).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json#packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc) with pnpm store cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (typecheck, lint, format:check, test:coverage)
        run: pnpm verify

  web-budgets:
    # P6-8 (ADR 0032): the axe sweep over every page and state of the web app at
    # 375/1024/1440 px x light/dark, failing on any serious or critical issue; then the PR page's
    # LCP with a warm cache. The runner's CPU speed is unknown, so LCP runs unthrottled here
    # against the 1.5 s budget (gross regressions); the 4x-throttled profile runs locally.
    # The screenshot baselines are macOS-only, so the visual project does not run here.
    name: axe sweep and LCP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json#packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc) with pnpm store cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: axe sweep
        run: pnpm test:a11y

      - name: LCP on the PR page (warm cache, CPU unthrottled)
        if: ${{ !cancelled() }}
        env:
          PERF_CPU_THROTTLE: "1"
          LCP_BUDGET_MS: "1500"
        run: pnpm test:lcp

      - name: Upload the LCP numbers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcp
          path: artifacts/perf/P6-8/lcp.json
          if-no-files-found: ignore
          retention-days: 30

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows (pinned actionlint container)
        run: scripts/security/actionlint.sh

  zap:
    # P7-3 (ADR 0025): OWASP ZAP baseline (passive) against the real server, the built web app
    # and a throwaway Postgres. Fails on any High or Medium alert and on any alert not accepted
    # in scripts/security/zap/rules.tsv. Images pinned by digest (scripts/security/images.sh).
    name: zap baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json#packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc) with pnpm store cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ZAP baseline scan
        run: pnpm security:zap
