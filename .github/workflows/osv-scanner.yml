# Dependency vulnerability scan of pnpm-lock.yaml with osv-scanner (pinned
# container via scripts/security/osv-scan.sh). Fails on HIGH/CRITICAL
# (CVSS >= 7.0) or unknown-severity advisories; lower severities are reported.
name: osv-scanner

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "5 5 * * *" # daily 05:05 UTC — new advisories appear without code changes

permissions:
  contents: read

jobs:
  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan pnpm-lock.yaml (pinned container)
        run: scripts/security/osv-scan.sh
