packages:
  - "apps/*"
  - "packages/*"
  - "ee"

onlyBuiltDependencies:
  - esbuild

# Supply-chain hardening (pnpm >= 10.21; enforced by Semgrep in CI).
# Wait 7 days before resolving a newly published version (malicious releases are
# usually pulled within days), never let an update downgrade trust settings, and
# block exotic (git/url/tarball) transitive dependencies.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true

# vite 8.3.5 (and the rolldown it pulls in) is younger than minimumReleaseAge, so
# pin the last mature patch for everyone (apps/web and vitest). Drop this once
# the next vite release is 7 days old and Dependabot bumps it.
overrides:
  vite: 8.3.4
